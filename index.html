<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Previsão do Tempo</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Digite uma cidade...">
      <button id="searchBtn">Buscar</button>
    </div>

    <div id="loading" class="hidden">Carregando...</div>
    <div id="errorMsg" class="hidden">Cidade não encontrada.</div>

    <div id="weatherResult" class="hidden">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" src="" alt="ícone do clima">
      <p id="temperature"></p>
      <p id="description"></p>
      <p id="feelsLike"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
